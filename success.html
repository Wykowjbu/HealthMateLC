<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán thành công - HealthMateLC</title>
    <link href="assets/css/login.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .success-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        height: 100vh;
        text-align: center;
        padding: 2rem;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        box-sizing: border-box;
      }

      .success-card {
        background: white;
        border-radius: 20px;
        padding: 3rem 2rem;
        box-shadow: 0 20px 40px rgba(248, 128, 5, 0.1);
        max-width: 500px;
        width: 100%;
        border: 2px solid rgba(248, 128, 5, 0.1);
      }

      .success-icon {
        width: 80px;
        height: 80px;
        background: var(--main_color_gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        animation: successPulse 2s ease-in-out infinite;
      }

      .success-icon::before {
        content: "✓";
        color: white;
        font-size: 2.5rem;
        font-weight: bold;
      }

      .success-title {
        font-size: 2rem;
        font-weight: 700;
        color: #33343e;
        margin-bottom: 1rem;
      }

      .success-message {
        font-size: 1.1rem;
        color: #666;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .countdown-container {
        background: var(--main_color_light);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      .countdown-text {
        font-size: 1rem;
        color: #33343e;
        margin-bottom: 0.5rem;
      }

      .countdown-timer {
        font-size: 2rem;
        font-weight: 700;
        color: var(--main_color);
      }

      .btn-container {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        min-width: 120px;
      }

      .btn-primary {
        background: var(--main_color_gradient);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(248, 128, 5, 0.3);
      }

      .btn-secondary {
        background: white;
        color: var(--main_color);
        border: 2px solid var(--main_color);
      }

      .btn-secondary:hover {
        background: var(--main_color_light);
      }

      .order-details {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 1.5rem;
        margin: 2rem 0;
        text-align: left;
      }

      .order-details h3 {
        color: #33343e;
        margin-bottom: 1rem;
        font-size: 1.2rem;
      }

      .order-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .order-info strong {
        color: var(--main_color);
        word-break: break-word;
      }

      .status-success {
        color: #28a745 !important;
      }

      .status-error {
        color: #dc3545 !important;
      }

      .loading {
        color: #6c757d;
        font-style: italic;
      }

      @keyframes successPulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(248, 128, 5, 0.7);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 20px rgba(248, 128, 5, 0);
        }
      }

      @media (max-width: 768px) {
        .success-container {
          padding: 1rem;
        }

        .success-card {
          padding: 2rem 1.5rem;
          max-width: calc(100% - 2rem);
          width: calc(100% - 2rem);
        }

        .success-title {
          font-size: 1.5rem;
        }

        .btn-container {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 100%;
          max-width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Elements -->
    <div id="background-img-container">
      <img
        class="background-1"
        src="assets/img/fpt_svg1.svg"
        alt="Background 1"
      />
      <img
        class="background-2"
        src="assets/img/fpt_svg2.svg"
        alt="Background 2"
      />
    </div>

    <!-- Success Content -->
    <div class="success-container">
      <div class="success-card">
        <div class="success-icon"></div>

        <h1 class="success-title">Thanh toán thành công!</h1>

        <p class="success-message">
          Cảm ơn bạn đã tin tưởng và sử dụng dịch vụ của HealthMateLC. Đơn hàng
          của bạn đã được xử lý thành công.
        </p>

        <div class="order-details">
          <h3>Thông tin đơn hàng</h3>
          <div class="order-info">
            <span>Mã đơn hàng:</span>
            <strong id="orderId">Đang tải...</strong>
          </div>
          <div class="order-info">
            <span>Thời gian:</span>
            <strong id="paymentTime">Đang tải...</strong>
          </div>
          <div class="order-info">
            <span>Trạng thái:</span>
            <strong id="status">Đang xử lý...</strong>
          </div>
        </div>

        <div class="countdown-container">
          <div class="countdown-text">Tự động chuyển về trang chủ sau:</div>
          <div class="countdown-timer" id="countdown">5</div>
        </div>

        <div class="btn-container">
          <a href="index.html" class="btn btn-primary">Về trang chủ ngay</a>
          <button onclick="window.print()" class="btn btn-secondary">
            In hóa đơn
          </button>
        </div>
      </div>
    </div>

    <script>
      // ✅ Hàm kiểm tra nếu URL chứa `/success/` hoặc có parameters PayOS
      function checkPaymentStatus() {
        const currentURL = window.location.href;
        const urlParams = new URLSearchParams(window.location.search);

        // Kiểm tra nếu có orderCode từ URL parameters (PayOS)
        const orderCodeFromParams = urlParams.get("orderCode");
        if (orderCodeFromParams) {
          document.getElementById("orderId").textContent = orderCodeFromParams;
          return; // Không cần check URL path nữa vì đã có từ parameters
        }

        // Kiểm tra URL path cho trường hợp khác
        if (currentURL.includes("/success/")) {
          const orderCode = getOrderCodeFromURL(currentURL);
          if (orderCode) {
            updateOrderStatus(orderCode, "SUCCESS");
            document.getElementById("orderId").textContent = orderCode;
          }
        }
      }

      // ✅ Lấy mã order từ URL
      function getOrderCodeFromURL(url) {
        const segments = url.split("/");
        const index = segments.indexOf("web");
        if (index !== -1 && segments.length > index + 1) {
          return segments[index + 1];
        }
        return null;
      }

      // ✅ Gửi API về backend để cập nhật trạng thái
      function updateOrderStatus(orderCode, paymentStatus) {
        // Hiển thị mã đơn hàng ngay khi có
        document.getElementById("orderId").textContent = orderCode;

        // Xác định status để gửi lên backend
        let apiStatus = "paid";
        if (paymentStatus === "CANCELLED" || paymentStatus === "cancel") {
          apiStatus = "cancelled";
        } else if (paymentStatus === "PENDING") {
          apiStatus = "pending";
        }

        fetch("http://localhost:8080/payment/update-status", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            orderCode: orderCode,
            status: apiStatus,
          }),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Cập nhật thất bại");
            return res.json();
          })
          .then((data) => {
            console.log("✅ Cập nhật trạng thái thành công:", data);

            // Hiển thị thông tin từ data nếu có
            if (data.orderInfo) {
              if (data.orderInfo.amount) {
                // Thêm trường amount nếu chưa có
                addOrderInfoField(
                  "amount",
                  "Số tiền:",
                  new Intl.NumberFormat("vi-VN").format(data.orderInfo.amount) +
                    " VNĐ"
                );
              }
              if (data.orderInfo.paymentMethod) {
                addOrderInfoField(
                  "paymentMethod",
                  "Phương thức:",
                  data.orderInfo.paymentMethod
                );
              }
              if (data.orderInfo.transactionTime) {
                document.getElementById("paymentTime").textContent = new Date(
                  data.orderInfo.transactionTime
                ).toLocaleString("vi-VN");
              }
            }
          })
          .catch((err) => {
            console.error("❌ Lỗi cập nhật trạng thái:", err);
            // Vẫn hiển thị thông tin UI nhưng ghi log lỗi API
          });
      }

      // Helper function để thêm trường thông tin động
      function addOrderInfoField(id, label, value) {
        // Kiểm tra xem đã có field này chưa
        if (!document.getElementById(id)) {
          const orderDetails = document.querySelector(".order-details");
          const newInfo = document.createElement("div");
          newInfo.className = "order-info";
          newInfo.innerHTML = `
            <span>${label}</span>
            <strong id="${id}" style="color: var(--main_color);">${value}</strong>
          `;
          // Chèn trước trường trạng thái
          const statusField = document.getElementById("status").parentElement;
          orderDetails.insertBefore(newInfo, statusField);
        } else {
          document.getElementById(id).textContent = value;
        }
      }

      // ✅ Thực thi khi trang load
      window.addEventListener("DOMContentLoaded", () => {
        // Set thời gian hiện tại trước
        document.getElementById("paymentTime").textContent =
          new Date().toLocaleString("vi-VN");

        // Kiểm tra payment status từ URL
        checkPaymentStatus();

        // Xử lý URL parameters cho trường hợp fallback
        handleURLParameters();
      });

      // ✅ Xử lý URL parameters từ PayOS
      function handleURLParameters() {
        const urlParams = new URLSearchParams(window.location.search);

        // Lấy thông tin từ PayOS URL
        const code = urlParams.get("code");
        const transactionId = urlParams.get("id");
        const cancel = urlParams.get("cancel");
        const status = urlParams.get("status");
        const orderCode = urlParams.get("orderCode");

        // Hiển thị mã đơn hàng từ PayOS
        if (orderCode) {
          document.getElementById("orderId").textContent = orderCode;
        }

        // Hiển thị trạng thái từ PayOS và cập nhật UI
        if (status) {
          let statusText = "";
          let statusColor = "";
          let pageTitle = "Thanh toán thành công!";
          let pageMessage =
            "Cảm ơn bạn đã tin tưởng và sử dụng dịch vụ của HealthMateLC. Đơn hàng của bạn đã được xử lý thành công.";

          switch (status) {
            case "PAID":
              statusText = "Đã thanh toán ✓";
              statusColor = "#28a745";
              break;
            case "PENDING":
              statusText = "Đang chờ thanh toán ⏳";
              statusColor = "#ffc107";
              pageTitle = "Đang chờ thanh toán";
              pageMessage =
                "Giao dịch của bạn đang được xử lý. Vui lòng chờ trong giây lát.";
              break;
            case "CANCELLED":
              statusText = "Đã hủy thanh toán ✗";
              statusColor = "#dc3545";
              pageTitle = "Thanh toán đã bị hủy";
              pageMessage =
                "Giao dịch của bạn đã bị hủy. Bạn có thể thử lại hoặc liên hệ hỗ trợ nếu cần.";
              // Thay đổi icon thành X
              document.querySelector(".success-icon").innerHTML = "✗";
              break;
            default:
              statusText = status;
              statusColor = "#6c757d";
          }

          document.getElementById("status").textContent = statusText;
          document.getElementById("status").style.color = statusColor;

          // Cập nhật tiêu đề và thông báo
          document.querySelector(".success-title").textContent = pageTitle;
          document.querySelector(".success-message").textContent = pageMessage;

          // Gửi API cập nhật trạng thái
          if (orderCode) {
            updateOrderStatus(orderCode, status);
          }
        }

        // Kiểm tra nếu cancel=true (ưu tiên hơn status)
        if (cancel === "true") {
          document.getElementById("status").textContent = "Giao dịch bị hủy ✗";
          document.getElementById("status").style.color = "#dc3545";
          document.querySelector(".success-title").textContent =
            "Giao dịch bị hủy!";
          document.querySelector(".success-message").textContent =
            "Giao dịch của bạn đã bị hủy. Vui lòng thử lại hoặc liên hệ hỗ trợ.";
          document.querySelector(".success-icon").innerHTML = "✗";

          // Gửi API với status CANCELLED
          if (orderCode) {
            updateOrderStatus(orderCode, "CANCELLED");
          }
        }

        // Hiển thị thông tin giao dịch nếu có
        if (transactionId) {
          addOrderInfoField("transactionId", "ID giao dịch:", transactionId);
        }

        // Hiển thị mã phản hồi từ PayOS
        if (code) {
          let codeText = "";
          switch (code) {
            case "00":
              codeText = "Thành công";
              break;
            case "01":
              codeText = "Thất bại";
              break;
            default:
              codeText = `Mã: ${code}`;
          }
          addOrderInfoField("responseCode", "Mã phản hồi:", codeText);
        }

        // Set phương thức thanh toán mặc định
        addOrderInfoField("paymentMethod", "Phương thức:", "PayOS");

        // Log tất cả parameters để debug
        console.log("🔍 PayOS URL Parameters:", {
          code,
          transactionId,
          cancel,
          status,
          orderCode,
          allParams: Object.fromEntries(urlParams),
        });
      }

      // Countdown timer - chỉ hoạt động nếu thanh toán thành công
      let countdown = 5;
      const countdownElement = document.getElementById("countdown");

      function startCountdown() {
        const timer = setInterval(() => {
          countdown--;
          countdownElement.textContent = countdown;

          if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = "employee.html";
          }
        }, 1000);
      }

      // Chỉ bắt đầu countdown nếu thanh toán thành công
      setTimeout(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get("status");
        const cancel = urlParams.get("cancel");

        if (status === "PAID" && cancel !== "true") {
          startCountdown();
        } else {
          // Ẩn countdown nếu không thành công
          document.querySelector(".countdown-container").style.display = "none";

          // Thay đổi text button cho trường hợp hủy/lỗi
          if (status === "CANCELLED" || cancel === "true") {
            document.querySelector(".btn-primary").textContent =
              "Thử lại thanh toán";
            document.querySelector(".btn-primary").href = "index.html"; // Hoặc link đến trang thanh toán
          }
        }
      }, 1000);

      // Optional: Add confetti effect
      function createConfetti() {
        const colors = ["#f88005", "#ed480d", "#f15c0a", "#ffd700", "#ff6b6b"];
        const confettiCount = 50;

        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement("div");
          confetti.style.position = "fixed";
          confetti.style.width = "10px";
          confetti.style.height = "10px";
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = "50%";
          confetti.style.pointerEvents = "none";
          confetti.style.zIndex = "1000";
          confetti.style.left = Math.random() * window.innerWidth + "px";
          confetti.style.top = "-10px";
          confetti.style.opacity = "0.8";

          document.body.appendChild(confetti);

          const fallDuration = Math.random() * 3000 + 2000;
          const sideMovement = (Math.random() - 0.5) * 200;

          confetti.animate(
            [
              {
                transform: "translateY(-10px) translateX(0px) rotate(0deg)",
                opacity: 0.8,
              },
              {
                transform: `translateY(${
                  window.innerHeight + 10
                }px) translateX(${sideMovement}px) rotate(360deg)`,
                opacity: 0,
              },
            ],
            {
              duration: fallDuration,
              easing: "ease-in",
            }
          ).onfinish = () => {
            confetti.remove();
          };
        }
      }

      // Trigger confetti effect on page load
      setTimeout(createConfetti, 500);
    </script>
  </body>
</html>
