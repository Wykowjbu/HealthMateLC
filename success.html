<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán thành công - HealthMateLC</title>
    <link href="assets/css/login.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .success-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        height: 100vh;
        text-align: center;
        padding: 2rem;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        box-sizing: border-box;
      }

      .success-card {
        background: white;
        border-radius: 20px;
        padding: 3rem 2rem;
        box-shadow: 0 20px 40px rgba(248, 128, 5, 0.1);
        max-width: 500px;
        width: 100%;
        border: 2px solid rgba(248, 128, 5, 0.1);
      }

      .success-icon {
        width: 80px;
        height: 80px;
        background: var(--main_color_gradient);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        animation: successPulse 2s ease-in-out infinite;
      }

      .success-icon::before {
        content: "✓";
        color: white;
        font-size: 2.5rem;
        font-weight: bold;
      }

      .success-title {
        font-size: 2rem;
        font-weight: 700;
        color: #33343e;
        margin-bottom: 1rem;
      }

      .success-message {
        font-size: 1.1rem;
        color: #666;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .countdown-container {
        background: var(--main_color_light);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      .countdown-text {
        font-size: 1rem;
        color: #33343e;
        margin-bottom: 0.5rem;
      }

      .countdown-timer {
        font-size: 2rem;
        font-weight: 700;
        color: var(--main_color);
      }

      .btn-container {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        min-width: 120px;
      }

      .btn-primary {
        background: var(--main_color_gradient);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(248, 128, 5, 0.3);
      }

      .btn-secondary {
        background: white;
        color: var(--main_color);
        border: 2px solid var(--main_color);
      }

      .btn-secondary:hover {
        background: var(--main_color_light);
      }

      .order-details {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 1.5rem;
        margin: 2rem 0;
        text-align: left;
      }

      .order-details h3 {
        color: #33343e;
        margin-bottom: 1rem;
        font-size: 1.2rem;
      }

      .order-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .order-info strong {
        color: var(--main_color);
        word-break: break-word;
      }

      .status-success {
        color: #28a745 !important;
      }

      .status-error {
        color: #dc3545 !important;
      }

      .loading {
        color: #6c757d;
        font-style: italic;
      }

      @keyframes successPulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(248, 128, 5, 0.7);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 20px rgba(248, 128, 5, 0);
        }
      }

      @media (max-width: 768px) {
        .success-container {
          padding: 1rem;
        }

        .success-card {
          padding: 2rem 1.5rem;
          max-width: calc(100% - 2rem);
          width: calc(100% - 2rem);
        }

        .success-title {
          font-size: 1.5rem;
        }

        .btn-container {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 100%;
          max-width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Elements -->
    <div id="background-img-container">
      <img
        class="background-1"
        src="assets/img/fpt_svg1.svg"
        alt="Background 1"
      />
      <img
        class="background-2"
        src="assets/img/fpt_svg2.svg"
        alt="Background 2"
      />
    </div>

    <!-- Success Content -->
    <div class="success-container">
      <div class="success-card">
        <div class="success-icon"></div>

        <h1 class="success-title">Thanh toán thành công!</h1>

        <p class="success-message">
          Cảm ơn bạn đã tin tưởng và sử dụng dịch vụ của HealthMateLC. Đơn hàng
          của bạn đã được xử lý thành công.
        </p>

        <div class="order-details">
          <h3>Thông tin đơn hàng</h3>
          <div class="order-info">
            <span>Mã đơn hàng:</span>
            <strong id="orderId">Đang tải...</strong>
          </div>
          <div class="order-info">
            <span>Thời gian:</span>
            <strong id="paymentTime">Đang tải...</strong>
          </div>
          <div class="order-info">
            <span>Trạng thái:</span>
            <strong id="status">Đang xử lý...</strong>
          </div>
        </div>

        <div class="countdown-container">
          <div class="countdown-text">Tự động chuyển về trang chủ sau:</div>
          <div class="countdown-timer" id="countdown">5</div>
        </div>

        <div class="btn-container">
          <a href="employee.html" class="btn btn-primary">Về trang chủ ngay</a>
        </div>
      </div>
    </div>

    <script>
      // ✅ Hàm chính - Xử lý URL và gọi API
      function processPaymentResult() {
        const urlParams = new URLSearchParams(window.location.search);

        // Lấy thông tin từ URL
        const orderCode = urlParams.get("orderCode");
        const status = urlParams.get("status");
        const transactionId = urlParams.get("id");
        const code = urlParams.get("code");
        const cancel = urlParams.get("cancel");

        console.log("🔍 Payment Result Parameters:", {
          orderCode,
          status,
          transactionId,
          code,
          cancel,
        });

        // Kiểm tra có đầy đủ thông tin không
        if (!orderCode || !status) {
          console.error("❌ Thiếu thông tin orderCode hoặc status");
          return;
        }

        // Hiển thị thông tin cơ bản ngay lập tức
        displayBasicInfo(orderCode, status, transactionId, code);

        // Gọi API cập nhật trạng thái
        updateOrderStatusAPI(orderCode, status);
      }

      // ✅ Hiển thị thông tin cơ bản từ URL
      function displayBasicInfo(orderCode, status, transactionId, code) {
        // Hiển thị mã đơn hàng
        document.getElementById("orderId").textContent = orderCode;

        // Hiển thị thời gian hiện tại
        document.getElementById("paymentTime").textContent =
          new Date().toLocaleString("vi-VN");

        // Hiển thị ID giao dịch nếu có
        if (transactionId) {
          addOrderInfoField("transactionId", "ID giao dịch:", transactionId);
        }

        // Hiển thị mã phản hồi
        if (code) {
          const codeText =
            code === "00"
              ? "Thành công"
              : code === "01"
              ? "Thất bại"
              : `Mã: ${code}`;
          addOrderInfoField("responseCode", "Mã phản hồi:", codeText);
        }

        // Set phương thức thanh toán
        addOrderInfoField("paymentMethod", "Phương thức:", "PayOS");

        // Cập nhật UI theo trạng thái
        updateUIByStatus(status);
      }

      // ✅ Cập nhật UI theo trạng thái
      function updateUIByStatus(status) {
        const successIcon = document.querySelector(".success-icon");
        const successTitle = document.querySelector(".success-title");
        const successMessage = document.querySelector(".success-message");
        const statusElement = document.getElementById("status");
        const countdownContainer = document.querySelector(
          ".countdown-container"
        );
        const btnPrimary = document.querySelector(".btn-primary");

        switch (status) {
          case "PAID":
            // Thành công - UI xanh
            successIcon.style.background = "var(--main_color_gradient)";
            successIcon.innerHTML = "✓";
            successTitle.textContent = "Thanh toán thành công!";
            successMessage.textContent =
              "Cảm ơn bạn đã tin tưởng và sử dụng dịch vụ của HealthMateLC. Đơn hàng của bạn đã được xử lý thành công.";
            statusElement.textContent = "Đã thanh toán ✓";
            statusElement.style.color = "#28a745";

            // Hiển thị countdown và bắt đầu đếm ngược
            countdownContainer.style.display = "block";
            startCountdown();

            // Hiệu ứng confetti
            setTimeout(createConfetti, 500);
            break;

          case "CANCELLED":
            // Hủy - UI đỏ
            successIcon.style.background =
              "linear-gradient(135deg, #dc3545, #c82333)";
            successIcon.innerHTML = "✗";
            successTitle.textContent = "Thanh toán đã bị hủy";
            successMessage.textContent =
              "Giao dịch của bạn đã bị hủy. Bạn có thể thử lại thanh toán hoặc liên hệ hỗ trợ nếu cần.";
            statusElement.textContent = "Đã hủy thanh toán ✗";
            statusElement.style.color = "#dc3545";

            // Ẩn countdown
            countdownContainer.style.display = "none";

            // Thay đổi button
            btnPrimary.textContent = "Thử lại thanh toán";
            btnPrimary.href = "employee.html"; // Hoặc trang thanh toán
            break;

          case "PENDING":
            // Chờ xử lý - UI vàng
            successIcon.style.background =
              "linear-gradient(135deg, #ffc107, #e0a800)";
            successIcon.innerHTML = "⏳";
            successTitle.textContent = "Đang chờ thanh toán";
            successMessage.textContent =
              "Giao dịch của bạn đang được xử lý. Vui lòng chờ trong giây lát hoặc kiểm tra lại sau.";
            statusElement.textContent = "Đang chờ thanh toán ⏳";
            statusElement.style.color = "#ffc107";

            // Ẩn countdown
            countdownContainer.style.display = "none";

            // Thay đổi button
            btnPrimary.textContent = "Kiểm tra lại";
            break;

          default:
            // Trạng thái không xác định
            statusElement.textContent = status;
            statusElement.style.color = "#6c757d";
            countdownContainer.style.display = "none";
        }
      }

      // ✅ Gọi API cập nhật trạng thái
      function updateOrderStatusAPI(orderCode, paymentStatus) {
        // Map status từ PayOS sang backend
        let apiStatus = "PENDING";
        switch (paymentStatus) {
          case "PAID":
            apiStatus = "PAID";
            break;
          case "CANCELLED":
            apiStatus = "CANCELLED";
            break;
          case "PENDING":
            apiStatus = "PENDING";
            break;
          default:
            apiStatus = "FAILED";
        }

        console.log(
          `🚀 Gọi API cập nhật: orderCode=${orderCode}, status=${apiStatus}`
        );

        // Gọi API
        fetch("http://localhost:8080/payment/update-status", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            orderCode: orderCode,
            status: apiStatus,
          }),
        })
          .then((res) => {
            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }
            return res.json();
          })
          .then((data) => {
            console.log("✅ Cập nhật trạng thái thành công:", data);

            // Hiển thị thêm thông tin từ API response nếu có
            if (data.orderInfo) {
              if (data.orderInfo.amount) {
                addOrderInfoField(
                  "amount",
                  "Số tiền:",
                  new Intl.NumberFormat("vi-VN").format(data.orderInfo.amount) +
                    " VNĐ"
                );
              }
              if (data.orderInfo.description) {
                addOrderInfoField(
                  "description",
                  "Mô tả:",
                  data.orderInfo.description
                );
              }
            }
          })
          .catch((err) => {
            console.error("❌ Lỗi cập nhật trạng thái:", err);
            // Vẫn hiển thị UI bình thường, chỉ log lỗi
          });
      }

      // ✅ Helper function để thêm thông tin động
      function addOrderInfoField(id, label, value) {
        if (!document.getElementById(id)) {
          const orderDetails = document.querySelector(".order-details");
          const newInfo = document.createElement("div");
          newInfo.className = "order-info";
          newInfo.innerHTML = `
            <span>${label}</span>
            <strong id="${id}" style="color: var(--main_color);">${value}</strong>
          `;

          // Chèn trước trường trạng thái
          const statusField = document.getElementById("status").parentElement;
          orderDetails.insertBefore(newInfo, statusField);
        } else {
          document.getElementById(id).textContent = value;
        }
      }

      // ✅ Countdown timer
      let countdown = 5;
      function startCountdown() {
        const countdownElement = document.getElementById("countdown");

        const timer = setInterval(() => {
          countdown--;
          countdownElement.textContent = countdown;

          if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = "employee.html";
          }
        }, 1000);
      }

      // ✅ Hiệu ứng confetti
      function createConfetti() {
        const colors = ["#f88005", "#ed480d", "#f15c0a", "#ffd700", "#ff6b6b"];
        const confettiCount = 50;

        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement("div");
          confetti.style.position = "fixed";
          confetti.style.width = "10px";
          confetti.style.height = "10px";
          confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = "50%";
          confetti.style.pointerEvents = "none";
          confetti.style.zIndex = "1000";
          confetti.style.left = Math.random() * window.innerWidth + "px";
          confetti.style.top = "-10px";
          confetti.style.opacity = "0.8";

          document.body.appendChild(confetti);

          const fallDuration = Math.random() * 3000 + 2000;
          const sideMovement = (Math.random() - 0.5) * 200;

          confetti.animate(
            [
              {
                transform: "translateY(-10px) translateX(0px) rotate(0deg)",
                opacity: 0.8,
              },
              {
                transform: `translateY(${
                  window.innerHeight + 10
                }px) translateX(${sideMovement}px) rotate(360deg)`,
                opacity: 0,
              },
            ],
            { duration: fallDuration, easing: "ease-in" }
          ).onfinish = () => confetti.remove();
        }
      }

      // ✅ Khởi tạo khi trang load
      window.addEventListener("DOMContentLoaded", () => {
        processPaymentResult();
      });
    </script>
  </body>
</html>
